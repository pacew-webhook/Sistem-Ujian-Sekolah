name: Deploy Google Apps Script

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Sistem Ujian Sekolah
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Check project
        run: |
          echo "=== CLASP STATUS ==="
          clasp status

      - name: Push source code
        run: |
          echo "=== PUSH TO APPS SCRIPT ==="
          clasp push --force

      - name: Create Apps Script version
        id: version
        run: |
          OUTPUT="$(clasp version "GitHub $GITHUB_SHA")"
          echo "$OUTPUT"

          VERSION="$(echo "$OUTPUT" | grep -oE '[0-9]+$' | tail -1)"

          if [ -z "$VERSION" ]; then
            echo "Gagal mendapatkan nomor versi."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Apps Script version: $VERSION"

      - name: Update Web App deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "=== UPDATE WEB APP ==="
          echo "Version: $VERSION"

          clasp deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --versionNumber "$VERSION"

      - name: Deployment summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "========================================"
          echo "DEPLOYMENT BERHASIL"
          echo "========================================"
          echo "Project : Sistem Ujian Sekolah"
          echo "Commit  : $GITHUB_SHA"
          echo "Version : $VERSION"
          echo "========================================"
