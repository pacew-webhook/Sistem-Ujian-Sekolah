name: Deploy Google Apps Script

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Google Apps Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Check clasp
        run: clasp status

      - name: Push source code
        run: clasp push --force

      - name: Create new Apps Script version
        id: version
        run: |
          VERSION=$(clasp version "GitHub commit $GITHUB_SHA" | tail -1 | grep -oE '[0-9]+$')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Web App deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          clasp deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --versionNumber "$VERSION"

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Google Apps Script deployment berhasil"
          echo "Commit: $GITHUB_SHA"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "======================================"
